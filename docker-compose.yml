services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Override in .env if you already run Postgres locally.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: uptimecrow
      POSTGRES_USER: uptimecrow
      POSTGRES_PASSWORD: uptimecrow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptimecrow"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      MODE: all
      PORT: "3000"
      NODE_ENV: development
      DATABASE_URL: postgresql://uptimecrow:uptimecrow@postgres:5432/uptimecrow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_PRO_PRODUCT_ID: ${POLAR_PRO_PRODUCT_ID:-}
      POLAR_TEAM_PRODUCT_ID: ${POLAR_TEAM_PRODUCT_ID:-}
      APP_URL: http://localhost:5173
      STATUS_PAGE_URL: http://localhost:5173/status
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/drizzle:/app/apps/api/drizzle
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      API_URL: http://api:3000
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - api

volumes:
  postgres_data:

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use container DNS resolver (populated at startup from /etc/resolv.conf)
    resolver ${RESOLVER} valid=10s ipv6=off;

    # Block access to sensitive paths
    location ~ /\.(git|env|htaccess|htpasswd) {
        return 404;
    }

    # Hashed build assets are content-addressed — cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A request for a file is not a request for a page. Without this, a missing
    # asset fell through to the SPA shell and answered 200 text/html — which is
    # how a missing og-image.png looked healthy while every social share was
    # imageless. No route knowledge needed, so nothing here can drift.
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|js|mjs|css|map|txt|xml|json|webmanifest|woff2?|ttf|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # The HTML entry must never be cached, so a new deploy (which references new
    # hashed bundles) is picked up on the very next load instead of a stale SPA
    # being served from the browser cache.
    location / {
        # $uri/index.html (not $uri/) so the pre-rendered route shells written by
        # scripts/prerender.mjs are served in place — `$uri/` makes nginx 301 to
        # a trailing slash, which would fight the canonical URLs and the sitemap.
        try_files $uri $uri.html $uri/index.html /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api {
        set $upstream ${API_URL};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /status {
        set $upstream ${API_URL};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /badge {
        set $upstream ${API_URL};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

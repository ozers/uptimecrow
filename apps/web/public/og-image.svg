<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#050507"/>

  <!-- Subtle radial glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="#00e676" opacity="0.6"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#1e1e26" stroke-width="1"/>
  <line x1="0" y1="430" x2="1200" y2="430" stroke="#1e1e26" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="#1e1e26" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="#1e1e26" stroke-width="1"/>

  <!-- Logo mark (simple crow/square icon) -->
  <rect x="84" y="84" width="52" height="52" rx="12" fill="#00e676"/>
  <text x="110" y="118" font-family="monospace" font-size="28" font-weight="700" fill="#050507" text-anchor="middle">UC</text>

  <!-- Brand name -->
  <text x="84" y="230" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="64" font-weight="700" fill="#ededf0" letter-spacing="-2">UptimeCrow</text>

  <!-- Subtitle -->
  <text x="84" y="300" font-family="'Sora', system-ui, sans-serif" font-size="28" font-weight="300" fill="#9393a0">Open-Source Uptime Monitoring + Status Pages</text>

  <!-- Divider line -->
  <line x1="84" y1="345" x2="520" y2="345" stroke="#2a2a35" stroke-width="1.5"/>

  <!-- Status indicator row -->
  <circle cx="84" cy="400" r="9" fill="#00e676"/>
  <circle cx="84" cy="400" r="18" fill="url(#dot-glow)"/>
  <text x="110" y="407" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="22" font-weight="600" fill="#00e676">All systems operational</text>

  <!-- Feature pills -->
  <rect x="84" y="445" width="170" height="36" rx="18" fill="#0c0c10" stroke="#2a2a35" stroke-width="1"/>
  <text x="169" y="468" font-family="'Sora', system-ui, sans-serif" font-size="15" fill="#9393a0" text-anchor="middle">50 monitors free</text>

  <rect x="266" y="445" width="160" height="36" rx="18" fill="#0c0c10" stroke="#2a2a35" stroke-width="1"/>
  <text x="346" y="468" font-family="'Sora', system-ui, sans-serif" font-size="15" fill="#9393a0" text-anchor="middle">Self-hostable</text>

  <rect x="438" y="445" width="160" height="36" rx="18" fill="#0c0c10" stroke="#2a2a35" stroke-width="1"/>
  <text x="518" y="468" font-family="'Sora', system-ui, sans-serif" font-size="15" fill="#9393a0" text-anchor="middle">MIT licensed</text>

  <rect x="610" y="445" width="180" height="36" rx="18" fill="#0c0c10" stroke="#2a2a35" stroke-width="1"/>
  <text x="700" y="468" font-family="'Sora', system-ui, sans-serif" font-size="15" fill="#9393a0" text-anchor="middle">MCP server</text>

  <!-- URL badge -->
  <text x="1116" y="555" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="18" fill="#5c5c6b" text-anchor="end">uptimecrow.com</text>

  <!-- Decorative terminal lines (right side) -->
  <rect x="820" y="150" width="296" height="180" rx="10" fill="#0c0c10" stroke="#1e1e26" stroke-width="1"/>
  <rect x="820" y="150" width="296" height="32" rx="10" fill="#141418"/>
  <rect x="820" y="170" width="296" height="12" fill="#141418"/>
  <circle cx="840" cy="166" r="5" fill="#ff5252"/>
  <circle cx="858" cy="166" r="5" fill="#ffab40"/>
  <circle cx="876" cy="166" r="5" fill="#00e676"/>
  <text x="840" y="207" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#00e676">● api.example.com</text>
  <text x="1090" y="207" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#00e676" text-anchor="end">UP</text>
  <text x="840" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#00e676">● dashboard.example.com</text>
  <text x="1090" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#00e676" text-anchor="end">UP</text>
  <text x="840" y="249" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#ff5252">● payment-api.example.com</text>
  <text x="1090" y="249" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#ff5252" text-anchor="end">DOWN</text>
  <text x="840" y="270" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#00e676">● cdn.example.com</text>
  <text x="1090" y="270" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#00e676" text-anchor="end">UP</text>
  <text x="840" y="291" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#00e676">● status.example.com</text>
  <text x="1090" y="291" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#00e676" text-anchor="end">UP</text>
  <text x="840" y="312" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#ffab40">● worker.example.com</text>
  <text x="1090" y="312" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#ffab40" text-anchor="end">SLOW</text>
</svg>

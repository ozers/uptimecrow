<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <title>UptimeCrow — Uptime Monitoring &amp; Status Pages for Developers</title>
  <meta name="description" content="Monitor your APIs and websites, alert on incidents, and serve pre-rendered status pages that stay online even when your origin goes down. Developer-first, open-source core.">
  <meta name="theme-color" content="#00e676">

  <meta property="og:type" content="website">
  <meta property="og:title" content="UptimeCrow — Uptime Monitoring &amp; Status Pages for Developers">
  <meta property="og:description" content="Monitor your services, alert on incidents, and serve pre-rendered status pages that stay online even when your origin goes down.">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:site_name" content="UptimeCrow">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="UptimeCrow — Uptime Monitoring &amp; Status Pages">
  <meta name="twitter:description" content="Monitor your services, alert on incidents, and serve pre-rendered status pages that stay online even when your origin goes down.">
  <meta name="twitter:image" content="/og-image.png">

  <style>* { margin: 0; padding: 0; box-sizing: border-box; }</style>

  <!-- Plausible Analytics (no-op unless VITE_PLAUSIBLE_DOMAIN is set at build time) -->
  <script>
    (function () {
      var d = "%VITE_PLAUSIBLE_DOMAIN%";
      if (!d || d.charAt(0) === "%") return;
      var s = document.createElement("script");
      s.defer = true;
      s.setAttribute("data-domain", d);
      s.src = "https://plausible.io/js/script.js";
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
